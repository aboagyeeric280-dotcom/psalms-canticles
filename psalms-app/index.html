<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f3ea" />
    <meta name="description" content="Daily Psalms and Canticles — the Dominican four-week psalter of the Province of St Joseph the Worker, Nigeria & Ghana. Works offline." />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Psalms" />
    <title>Daily Psalms and Canticles</title>
    <script>
      // Apply the stored theme before first paint so the app never flashes.
      try {
        var p = JSON.parse(localStorage.getItem('dpc.prefs') || '{}');
        var r = document.documentElement;
        r.dataset.theme = p.theme || 'light';
        r.dataset.aesthetic = p.aesthetic || 'vellum';
        r.dataset.gloss = p.gloss || 'matte';
        if (p.font) r.dataset.font = p.font;
        if (p.size) r.style.setProperty('--reader-size', p.size + 'px');
        if (p.leading) r.style.setProperty('--reader-leading', String(p.leading));
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
