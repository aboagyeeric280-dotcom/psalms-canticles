<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Daily Psalms and Canticles">
  <title>Daily Psalms and Canticles</title>
  <!-- The arms of the Order of Preachers: party per pale argent and sable,
       a cross fleury counterchanged. -->
  <defs>
    <clipPath id="sq"><rect width="512" height="512" rx="112"/></clipPath>
    <clipPath id="left"><rect width="256" height="512"/></clipPath>
    <clipPath id="right"><rect x="256" width="256" height="512"/></clipPath>
    <g id="cross">
      <rect x="228" y="100" width="56" height="312" rx="8"/>
      <rect x="100" y="228" width="312" height="56" rx="8"/>
      <circle cx="256" cy="108" r="33"/><circle cx="256" cy="404" r="33"/>
      <circle cx="108" cy="256" r="33"/><circle cx="404" cy="256" r="33"/>
    </g>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="256" height="512" fill="#faf8f4"/>
    <rect x="256" width="256" height="512" fill="#1d1a16"/>
    <g clip-path="url(#left)"><use href="#cross" fill="#1d1a16"/></g>
    <g clip-path="url(#right)"><use href="#cross" fill="#faf8f4"/></g>
  </g>
</svg>
